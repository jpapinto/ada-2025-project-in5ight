/* ===== Scoped container (nothing leaks) ===== */
.overperformers-section {

/* ===== Carousel ===== */
.overperformers-carousel {
  display: flex;
  gap: 22px;
  overflow-x: auto;
  padding-bottom: 18px;
  scroll-behavior: smooth;
}

/* Minimal scrollbar */
.overperformers-carousel::-webkit-scrollbar {
  height: 6px;
}
.overperformers-carousel::-webkit-scrollbar-track {

.overperformers-carousel::-webkit-scrollbar-thumb {

/* ===== Card ===== */
.overperformer-card {
  min-width: 220px;
  max-width: 220px;
  background: #ffffff;
  border-radius: 2px;

  box-shadow:
    0 4px 14px rgba(0,0,0,0.06),
    0 1px 3px rgba(0,0,0,0.04);

  display: flex;
  flex-direction: column;
  overflow: hidden;
  cursor: pointer;

  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.overperformer-card:hover {
  transform: translateY(-4px);
  box-shadow:
    0 10px 28px rgba(0,0,0,0.1),
    0 4px 10px rgba(0,0,0,0.06);
}

/* ===== Image ===== */
.overperformer-image {
  width: 100%;
  height: 100px;
  object-fit: contain;
  background: #ffffff;
}

/* ===== Card content ===== */
.overperformer-content {

.overperformer-name {

.overperformer-description {
